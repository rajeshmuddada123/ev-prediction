server.port=8080

# Application Details
spring.application.name=smart-ev-platform

# Database Configuration (MySQL with embedded H2 fallback support)
# To use external MySQL directly, configure credentials or environment variables:
# SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/smartev_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# SPRING_DATASOURCE_USERNAME=root
# SPRING_DATASOURCE_PASSWORD=root

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/smartev_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console if using H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# Weather and Solar APIs
app.weather.open-meteo.base-url=https://api.open-meteo.com/v1/forecast
